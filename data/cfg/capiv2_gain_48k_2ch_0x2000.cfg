# Configuration file for Appi_Gain unit test
# Author: NP
# What this config file does:
#    - defines the media format
#    - Sets Gain Parameters
#    - Processes buffers as specified by NumBuffers

# Set Media Format
# Only signed/de-interleaved input is accepted to the test
# signed/interleaved output will be generated   
SetMediaFormat
   SetBitstreamFormat 0x09001000
   SetDataFormat 0
   SetNumChannelsAndMapping 2
   1 2
   SetBitsPerSample 16
   QFactor 15
   SetSamplingRate 48000
   SetIsSigned 1
   SetInterleaving 2
   SetPortIndex 0 

#Set enable
SetParamInband
   PayloadSizeInBytes 36
   00 00 00 00    # Data Payload address
   00 00 00 00
   00 00 00 00
   10 00 00 00    # Size of Payload
   6F 10 00 87    # MODULE_ID_GAIN_MODULE      0x8700106F
   26 10 00 08    # PARAM_ID_ENABLE  0x08001026
   04 00 00 00    # Param Size and Padding
   00 00 00 00    # for error code (dummy)
   01 00 00 00	  # Enable: 1


#Set gain
SetParamInband
   PayloadSizeInBytes 36
   00 00 00 00    # Data Payload address
   00 00 00 00
   00 00 00 00
   10 00 00 00    # Size of Payload
   6F 10 00 87    # MODULE_ID_GAIN_MODULE      0x8700106F
   75 11 00 08    # PARAM_ID_GAIN_MODULE_GAIN  0x08001175
   04 00 00 00    # Param Size and Padding
   00 00 00 00    # for error code (dummy)
   00 20		  # Gain: 0x2000 (1)
   00 00		  # Reserved: 0	
   
   
# Begin Processing
ProcessData
   NumBuffers 10
     

